[project]
name = "satisfactory-shell"
version = "0.2.0"
description = "Process manager, metrics, updater and WebUI for a Satisfactory Dedicated Server"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "turbo3000r" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "psutil>=6.0",
    "httpx>=0.27",
    "pylint (>=4.0.8,<5.0.0)",
    "ruff (>=0.16.8,<0.17.0)",
]

[project.scripts]
satisfactory-shell = "satisfactory_shell.__main__:main"
build-exe = "satisfactory_shell.build:main"

[tool.poetry]
packages = [{ include = "satisfactory_shell", from = "src" }]

[tool.poetry.group.dev.dependencies]
pyinstaller = ">=6.10"
pytest = ">=8.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pylint.main]
ignore-paths = ["^build/", "^dist/"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-attributes = 15
max-public-methods = 25
min-public-methods = 1
max-locals = 20
max-statements = 60

[tool.pylint.messages_control]
disable = [
    "missing-function-docstring",
    "missing-class-docstring",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-public-methods",
    "too-many-locals",
    "too-many-statements",
    "too-many-arguments",
    "too-many-positional-arguments",
    "duplicate-code",
    "consider-using-with",
]
