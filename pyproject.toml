[project]
name = "satisfactory-shell"
version = "0.1.0"
description = "Process manager, metrics, updater and WebUI for a Satisfactory Dedicated Server"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "turbo3000r" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "psutil>=6.0",
    "httpx>=0.27",
]

[project.scripts]
satisfactory-shell = "satisfactory_shell.__main__:main"
build-exe = "satisfactory_shell.build:main"

[tool.poetry]
packages = [{ include = "satisfactory_shell", from = "src" }]

[tool.poetry.group.dev.dependencies]
pyinstaller = ">=6.10"
pytest = ">=8.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
