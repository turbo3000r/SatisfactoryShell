{% extends "base.html" %}
{% block title %}Console - Satisfactory Shell{% endblock %}
{% block content %}
<h1>Console</h1>

<section class="panel">
  <h2>Run command</h2>
  <form hx-post="/console/run" hx-target="#history" hx-swap="innerHTML" hx-on::after-request="this.reset()" class="actions">
    <input type="text" name="command" placeholder="e.g. server.SaveGame backup, or ? for help" style="flex:1" required autofocus autocomplete="off">
    <button type="submit" class="primary">Run</button>
  </form>
  <div id="history" style="margin-top:.8rem">
    {% include "partials/console_history.html" %}
  </div>
</section>

<section class="panel" style="margin-top:1rem">
  <div class="actions" style="justify-content:space-between">
    <h2 style="margin:0">FactoryGame.log <span class="muted small">{{ log_file }}</span></h2>
    <label class="check"><input type="checkbox" id="follow" checked> follow</label>
  </div>
  <pre class="log" id="log">{{ log_text }}</pre>
</section>
{% endblock %}

{% block scripts %}
<script>
(function () {
  let offset = {{ log_offset }};
  const pre = document.getElementById('log');
  const follow = document.getElementById('follow');
  const MAX = 400000;
  pre.scrollTop = pre.scrollHeight;
  async function tick() {
    try {
      const r = await fetch('/console/tail?offset=' + offset, { cache: 'no-store' });
      if (r.status === 401) { location.href = '/login'; return; }
      const j = await r.json();
      if (j.rotated) pre.textContent = '';
      if (j.text) {
        pre.textContent += j.text;
        if (pre.textContent.length > MAX) pre.textContent = pre.textContent.slice(-MAX);
        if (follow.checked) pre.scrollTop = pre.scrollHeight;
      }
      offset = j.offset;
    } catch (e) { /* ignore */ }
  }
  setInterval(tick, 1000);
})();
</script>
{% endblock %}
