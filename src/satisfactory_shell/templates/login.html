{% extends "base.html" %}
{% block title %}Login - Satisfactory Shell{% endblock %}
{% block content %}
<div class="panel login-box">
  <h1>Login</h1>
  <p class="muted small">Use the Satisfactory server <b>admin password</b>. Leave empty to try passwordless login on an unclaimed server.</p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="password" name="password" placeholder="Admin password" autofocus autocomplete="current-password">
    <button type="submit" class="primary">Sign in</button>
  </form>
</div>
{% endblock %}
